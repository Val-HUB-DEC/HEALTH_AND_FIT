<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ajouter un aliment</title>

    <link
        rel="stylesheet"
        href="css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         EN-TÊTE
    ========================== -->

    <header>

        <div class="container">

            <h1 class="mb-1">
                Ajouter un <span>aliment</span>
            </h1>

        </div>

    </header>


    <!-- =========================
         RECHERCHE
    ========================== -->

    <main class="container">
        <p class="text-secondary mb-0">
                Choisis l'aliment à ajouter
        </p>
        <section>

            <div class="card p-3">

                <label
                    for="recherche-aliment"
                    class="form-label"
                >
                    Rechercher
                </label>

                <input
                    type="text"
                    id="recherche-aliment"
                    class="form-control"
                    placeholder="Ex : poulet, riz, tomate..."
                >

            </div>

        </section>


        <!-- =========================
             FILTRE CATÉGORIE
        ========================== -->

        <section>

            <div class="card p-3">

                <label
                    for="filtre-categorie"
                    class="form-label"
                >
                    Catégorie
                </label>

                <select
                    id="filtre-categorie"
                    class="form-select"
                >

                    <option value="">
                        Toutes les catégories
                    </option>

                </select>

            </div>

        </section>


        <!-- =========================
             LISTE DES ALIMENTS
        ========================== -->

        <section>

            <h2 class="mb-3">
                Aliments
            </h2>

            <div id="liste-aliments">

                <p class="text-secondary">
                    Chargement des aliments...
                </p>

            </div>

        </section>

    </main>


    <!-- Navigation -->
    <nav class="navbar fixed-bottom border-top">

        <div class="container-fluid justify-content-around py-2">


            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='index.html'">

                <span>⌂</span>
                <small>Accueil</small>

            </button>


            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='alimentation.html'">

                <span>🍽</span>
                <small>Repas</small>

            </button>


            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='activite.html'">

                <span>🏃</span>
                <small>Activité</small>

            </button>


            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='poids.html'">

                <span>⚖</span>
                <small>Poids</small>

            </button>


            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='parametres.html'">

                <span>⚙</span>
                <small>Réglages</small>

            </button>

        </div>

    </nav>


    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
