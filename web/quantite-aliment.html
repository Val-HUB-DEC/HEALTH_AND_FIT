<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quantité de l'aliment</title>

    <link
        rel="stylesheet"
        href="css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         EN-TÊTE
    ========================== -->

    <header>

        <div class="container">

            <h1 id="nom-aliment" class="mb-0">
                Aliment
            </h1>

        </div>

    </header>


    <!-- =========================
         CONTENU
    ========================== -->

    <main class="container">

        <p
            id="categorie-aliment"
            class="text-secondary mb-3"
        >
            Catégorie
        </p>


        <!-- =========================
             INFORMATIONS NUTRITIONNELLES
        ========================== -->

        <section>

            <div class="card p-3">

                <h2 class="mb-2">
                    Valeurs nutritionnelles
                </h2>

                <p class="text-secondary mb-3">
                    Pour
                    <span id="quantite-reference">
                        100
                    </span>
                    <span id="unite-reference">
                        g
                    </span>
                </p>


                <div class="row text-center">


                    <!-- Calories -->

                    <div class="col-6 col-md-3 mb-3">

                        <div class="info-nutrition">

                            <small>
                                Calories
                            </small>

                            <div class="valeur">

                                <span id="kcal-aliment">
                                    0
                                </span>

                                kcal

                            </div>

                        </div>

                    </div>


                    <!-- Protéines -->

                    <div class="col-6 col-md-3 mb-3">

                        <div class="info-nutrition">

                            <small>
                                Protéines
                            </small>

                            <div class="valeur">

                                <span id="proteines-aliment">
                                    0
                                </span>

                                g

                            </div>

                        </div>

                    </div>


                    <!-- Glucides -->

                    <div class="col-6 col-md-3 mb-3">

                        <div class="info-nutrition">

                            <small>
                                Glucides
                            </small>

                            <div class="valeur">

                                <span id="glucides-aliment">
                                    0
                                </span>

                                g

                            </div>

                        </div>

                    </div>


                    <!-- Lipides -->

                    <div class="col-6 col-md-3 mb-3">

                        <div class="info-nutrition">

                            <small>
                                Matières grasses
                            </small>

                            <div class="valeur">

                                <span id="lipides-aliment">
                                    0
                                </span>

                                g

                            </div>

                        </div>

                    </div>


                </div>

            </div>

        </section>


        <!-- =========================
             QUANTITÉ
        ========================== -->

        <section>

            <div class="card p-3">

                <h2 class="mb-3">
                    Quantité
                </h2>

                <div class="input-group">

                    <input
                        type="number"
                        id="quantite-aliment"
                        class="form-control form-control-sm"
                        min="0"
                        step="0.1"
                        value="100"
                    >

                    <span
                        class="input-group-text"
                        id="unite-quantite"
                    >
                        g
                    </span>

                </div>

            </div>

        </section>


        <!-- =========================
             REPAS
        ========================== -->

        <section>

            <div class="card p-3">

                <h2 class="mb-3">
                    Repas
                </h2>


                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="repas"
                        id="repas-petit-dejeuner"
                        value="petitDejeuner"
                    >

                    <label
                        class="form-check-label"
                        for="repas-petit-dejeuner"
                    >
                        Petit-déjeuner
                    </label>

                </div>


                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="repas"
                        id="repas-dejeuner"
                        value="dejeuner"
                        checked
                    >

                    <label
                        class="form-check-label"
                        for="repas-dejeuner"
                    >
                        Déjeuner
                    </label>

                </div>


                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="repas"
                        id="repas-diner"
                        value="diner"
                    >

                    <label
                        class="form-check-label"
                        for="repas-diner"
                    >
                        Dîner
                    </label>

                </div>


                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="repas"
                        id="repas-collation"
                        value="collation"
                    >

                    <label
                        class="form-check-label"
                        for="repas-collation"
                    >
                        Collation
                    </label>

                </div>

            </div>

        </section>


        <!-- =========================
             RÉSULTAT CALCULÉ
        ========================== -->

        <section>

            <div class="card p-3">

                <h2 class="mb-3">
                    Pour cette quantité
                </h2>

                <div
                    id="resume-quantite"
                    class="info-nutrition"
                >

                    <p class="mb-2">

                        <span class="text-secondary">
                            Calories
                        </span>

                        <strong
                            id="total-kcal"
                            class="valeur"
                        >
                            0 kcal
                        </strong>

                    </p>


                    <p class="mb-2">

                        <span class="text-secondary">
                            Protéines
                        </span>

                        <strong
                            id="total-proteines"
                            class="valeur"
                        >
                            0 g
                        </strong>

                    </p>


                    <p class="mb-2">

                        <span class="text-secondary">
                            Glucides
                        </span>

                        <strong
                            id="total-glucides"
                            class="valeur"
                        >
                            0 g
                        </strong>

                    </p>


                    <p class="mb-0">

                        <span class="text-secondary">
                            Matières grasses
                        </span>

                        <strong
                            id="total-lipides"
                            class="valeur"
                        >
                            0 g
                        </strong>

                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             BOUTON AJOUTER
        ========================== -->

        <section>

            <button
                type="button"
                id="ajouter-aliment-repas"
                class="btn btn-primary w-100"
            >
                Ajouter au repas
            </button>

        </section>


    </main>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar fixed-bottom border-top">

        <div class="container-fluid justify-content-around py-2">


            <!-- Accueil -->

            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='index.html'"
            >

                <span>⌂</span>

                <small>
                    Accueil
                </small>

            </button>


            <!-- Repas -->

            <button
                class="btn active d-flex flex-column align-items-center"
                onclick="window.location.href='alimentation.html'"
            >

                <span>🍽</span>

                <small>
                    Repas
                </small>

            </button>


            <!-- Activité -->

            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='activite.html'"
            >

                <span>🏃</span>

                <small>
                    Activité
                </small>

            </button>


            <!-- Poids -->

            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='poids.html'"
            >

                <span>⚖</span>

                <small>
                    Poids
                </small>

            </button>


            <!-- Réglages -->

            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='parametres.html'"
            >

                <span>⚙</span>

                <small>
                    Réglages
                </small>

            </button>


        </div>

    </nav>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
