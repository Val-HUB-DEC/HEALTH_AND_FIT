<!DOCTYPE html>

<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Health & FIT</title>

<link
    rel="stylesheet"
    href="css/bootstrap.min.css"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>

<body>

<!-- =========================
     EN-TÊTE
========================== -->

<header>

    <div class="container">

        <h1 class="mb-0">
            Health <span>&</span> FIT
        </h1>

    </div>

</header>


<!-- =========================
     CONTENU
========================== -->

<main class="container">


    <!-- =========================
         BIENVENUE
    ========================== -->

    <section>

        <p class="text-secondary mb-0">
            Bonjour Valentin 👋
        </p>

    </section>


    <!-- =========================
         OBJECTIF DU JOUR
    ========================== -->

    <section>

        <div class="card p-3">

            <p class="text-secondary small mb-1">
                OBJECTIF DU JOUR
            </p>

            <div class="d-flex align-items-end gap-2">

                <h2 class="mb-0">
                    0%
                </h2>

                <p class="text-secondary small mb-1">
                    de l'objectif atteint
                </p>

            </div>

            <div class="progress mt-3">

                <div
                    class="progress-bar"
                    style="width: 0%;"
                >
                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         AUJOURD'HUI
    ========================== -->

    <section>

        <div class="card p-3">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="mb-0">
                    Aujourd'hui
                </h2>

                <span class="text-secondary small">
                    28 sept.
                </span>

            </div>


            <div class="row text-center">


                <!-- Calories -->

                <div class="col-4">

                    <div class="fs-3 mb-1">
                        🔥
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        kcal
                    </small>

                </div>


                <!-- Poids -->

                <div class="col-4">

                    <div class="fs-3 mb-1">
                        ⚖️
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        kg
                    </small>

                </div>


                <!-- Activité -->

                <div class="col-4">

                    <div class="fs-3 mb-1">
                        🚶
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        pas
                    </small>

                </div>


            </div>

        </div>

    </section>


    <!-- =========================
         ACCÈS RAPIDES
    ========================== -->

    <section>

        <h2 class="mb-3">
            Accès rapides
        </h2>


        <div class="list-group">


            <!-- Alimentation -->

            <button
                type="button"
                class="list-group-item list-group-item-action"
                onclick="window.location.href='alimentation.html'"
            >

                <div class="d-flex align-items-center">

                    <span class="fs-4 me-3">
                        🍽️
                    </span>

                    <div class="text-start">

                        <div class="fw-semibold">
                            Alimentation
                        </div>

                        <small>
                            Mes repas et mes calories
                        </small>

                    </div>

                    <span class="ms-auto">
                        →
                    </span>

                </div>

            </button>


            <!-- Activité -->

            <button
                type="button"
                class="list-group-item list-group-item-action"
                onclick="window.location.href='activite.html'"
            >

                <div class="d-flex align-items-center">

                    <span class="fs-4 me-3">
                        🏃
                    </span>

                    <div class="text-start">

                        <div class="fw-semibold">
                            Activité
                        </div>

                        <small>
                            Mes activités et mes pas
                        </small>

                    </div>

                    <span class="ms-auto">
                        →
                    </span>

                </div>

            </button>


            <!-- Progression -->

            <button
                type="button"
                class="list-group-item list-group-item-action"
                onclick="window.location.href='poids.html'"
            >

                <div class="d-flex align-items-center">

                    <span class="fs-4 me-3">
                        📊
                    </span>

                    <div class="text-start">

                        <div class="fw-semibold">
                            Progression
                        </div>

                        <small>
                            Mon évolution
                        </small>

                    </div>

                    <span class="ms-auto">
                        →
                    </span>

                </div>

            </button>


        </div>

    </section>


</main>


<!-- =========================
     NAVIGATION
========================== -->

<nav class="navbar fixed-bottom border-top">

    <div class="container-fluid justify-content-around py-2">


        <!-- Accueil -->

        <button
            class="btn active d-flex flex-column align-items-center"
            onclick="window.location.href='index.html'"
        >

            <span>⌂</span>

            <small>
                Accueil
            </small>

        </button>


        <!-- Repas -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='alimentation.html'"
        >

            <span>🍽</span>

            <small>
                Repas
            </small>

        </button>


        <!-- Activité -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='activite.html'"
        >

            <span>🏃</span>

            <small>
                Activité
            </small>

        </button>


        <!-- Poids -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='poids.html'"
        >

            <span>⚖</span>

            <small>
                Poids
            </small>

        </button>


        <!-- Réglages -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='parametres.html'"
        >

            <span>⚙</span>

            <small>
                Réglages
            </small>

        </button>


    </div>

</nav>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>

</html>
