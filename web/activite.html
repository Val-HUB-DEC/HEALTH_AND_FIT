<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Health & FIT - Activité</title>

<link
    rel="stylesheet"
    href="css/bootstrap.min.css"
>

<link
    rel="stylesheet"
    href="css/style.css"
>


</head>

<body>


<!-- =========================
     EN-TÊTE
========================== -->

<header>

    <div class="container">

        <h1 class="mb-0">
            Activité
        </h1>

    </div>

</header>


<!-- =========================
     CONTENU
========================== -->

<main class="container">


    <!-- =========================
         RÉSUMÉ DU JOUR
    ========================== -->

    <section>

        <div class="card p-3">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="mb-0">
                    Aujourd'hui
                </h2>

                <span class="text-secondary small">
                    28 sept.
                </span>

            </div>


            <div class="row text-center">


                <!-- Calories -->

                <div class="col-6 mb-4">

                    <div class="fs-3 mb-1">
                        🔥
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        kcal brûlées
                    </small>

                </div>


                <!-- Pas -->

                <div class="col-6 mb-4">

                    <div class="fs-3 mb-1">
                        🚶
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        pas
                    </small>

                </div>


                <!-- Distance -->

                <div class="col-6">

                    <div class="fs-3 mb-1">
                        📍
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        km
                    </small>

                </div>


                <!-- Temps -->

                <div class="col-6">

                    <div class="fs-3 mb-1">
                        ⏱️
                    </div>

                    <div class="fw-bold">
                        --
                    </div>

                    <small>
                        min d'activité
                    </small>

                </div>


            </div>

        </div>

    </section>


    <!-- =========================
         OBJECTIF D'ACTIVITÉ
    ========================== -->

    <section>

        <div class="card p-3">

            <div class="d-flex justify-content-between align-items-end mb-3">

                <div>

                    <p class="text-secondary small mb-1">
                        OBJECTIF D'ACTIVITÉ
                    </p>

                    <h2 class="mb-0">
                        0%
                    </h2>

                </div>

                <span class="text-secondary small">
                    -- / -- kcal
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    style="width: 0%;"
                >
                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         ACTIVITÉS DU JOUR
    ========================== -->

    <section>

        <h2 class="mb-3">
            Activités du jour
        </h2>


        <div
            id="liste-activites"
            class="card p-3"
        >

            <p class="text-secondary small mb-0">
                Aucune activité enregistrée aujourd'hui.
            </p>

        </div>

    </section>


    <!-- =========================
         AJOUTER UNE ACTIVITÉ
    ========================== -->

    <section>

        <h2 class="mb-3">
            Ajouter une activité
        </h2>


        <div class="card p-3">


            <!-- Type d'activité -->

            <div class="mb-3">

                <label
                    for="type-activite"
                    class="form-label"
                >
                    Activité
                </label>

                <select
                    id="type-activite"
                    class="form-select form-select-sm"
                >

                    <option value="marche">
                        Marche
                    </option>

                    <option value="course">
                        Course
                    </option>

                    <option value="velo">
                        Vélo
                    </option>

                    <option value="musculation">
                        Musculation
                    </option>

                    <option value="natation">
                        Natation
                    </option>

                    <option value="autre">
                        Autre
                    </option>

                </select>

            </div>


            <!-- Durée -->

            <div class="mb-3">

                <label
                    for="duree-activite"
                    class="form-label"
                >
                    Durée (minutes)
                </label>

                <input
                    type="number"
                    id="duree-activite"
                    class="form-control form-control-sm"
                    placeholder="Ex : 30"
                >

            </div>


            <!-- Calories -->

            <div class="mb-3">

                <label
                    for="calories-activite"
                    class="form-label"
                >
                    Calories brûlées
                </label>

                <input
                    type="number"
                    id="calories-activite"
                    class="form-control form-control-sm"
                    placeholder="Ex : 250"
                >

            </div>


            <!-- Bouton -->

            <button
                type="button"
                id="ajouter-activite"
                class="btn btn-primary w-100"
            >
                Ajouter l'activité
            </button>


        </div>

    </section>


    <!-- =========================
         HISTORIQUE
    ========================== -->

    <section>

        <h2 class="mb-3">
            Historique
        </h2>


        <div class="card p-3">

            <p class="text-secondary small mb-0">
                Les activités enregistrées apparaîtront ici.
            </p>

        </div>

    </section>


</main>


<!-- =========================
     NAVIGATION
========================== -->

<nav class="navbar fixed-bottom border-top">

    <div class="container-fluid justify-content-around py-2">


        <!-- Accueil -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='index.html'"
        >

            <span>⌂</span>

            <small>
                Accueil
            </small>

        </button>


        <!-- Repas -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='alimentation.html'"
        >

            <span>🍽</span>

            <small>
                Repas
            </small>

        </button>


        <!-- Activité -->

        <button
            class="btn active d-flex flex-column align-items-center"
            onclick="window.location.href='activite.html'"
        >

            <span>🏃</span>

            <small>
                Activité
            </small>

        </button>


        <!-- Poids -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='poids.html'"
        >

            <span>⚖</span>

            <small>
                Poids
            </small>

        </button>


        <!-- Réglages -->

        <button
            class="btn d-flex flex-column align-items-center"
            onclick="window.location.href='parametres.html'"
        >

            <span>⚙</span>

            <small>
                Réglages
            </small>

        </button>


    </div>

</nav>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>

</html>
