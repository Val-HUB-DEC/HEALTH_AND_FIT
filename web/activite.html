<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health & FIT - Activité</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- En-tête -->
    <header class="px-4 pt-4 pb-3">

        <p class="small mb-1">
            Health & FIT
        </p>

        <h1 class="fw-bold mb-0">
            Activité
        </h1>

    </header>


    <!-- Contenu principal -->
    <main class="container-fluid px-4 pb-5">


        <!-- Résumé du jour -->
        <section class="mb-5">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="h5 fw-bold mb-0">
                    Aujourd'hui
                </h2>

                <span class="small">
                    28 sept.
                </span>

            </div>


            <!-- Statistiques -->
            <div class="row text-center">


                <!-- Calories -->
                <div class="col-6 mb-4">

                    <div class="fs-3 mb-1">
                        🔥
                    </div>

                    <div class="fs-4 fw-bold">
                        --
                    </div>

                    <small>
                        kcal brûlées
                    </small>

                </div>


                <!-- Pas -->
                <div class="col-6 mb-4">

                    <div class="fs-3 mb-1">
                        🚶
                    </div>

                    <div class="fs-4 fw-bold">
                        --
                    </div>

                    <small>
                        pas
                    </small>

                </div>


                <!-- Distance -->
                <div class="col-6">

                    <div class="fs-3 mb-1">
                        📍
                    </div>

                    <div class="fs-4 fw-bold">
                        --
                    </div>

                    <small>
                        km
                    </small>

                </div>


                <!-- Temps -->
                <div class="col-6">

                    <div class="fs-3 mb-1">
                        ⏱️
                    </div>

                    <div class="fs-4 fw-bold">
                        --
                    </div>

                    <small>
                        min d'activité
                    </small>

                </div>

            </div>

        </section>


        <!-- Objectif d'activité -->
        <section class="mb-5">

            <div class="d-flex justify-content-between align-items-end mb-2">

                <div>

                    <p class="small mb-1">
                        OBJECTIF D'ACTIVITÉ
                    </p>

                    <h2 class="h5 fw-bold mb-0">
                        0%
                    </h2>

                </div>

                <span class="small">
                    -- / -- kcal
                </span>

            </div>


            <div class="progress"
                 style="height: 5px;">

                <div
                    class="progress-bar"
                    style="width: 0%;">
                </div>

            </div>

        </section>


        <!-- Activités du jour -->
        <section class="mb-5">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2 class="h5 fw-bold mb-0">
                    Activités du jour
                </h2>

            </div>


            <div id="liste-activites">

                <p class="small mb-0">
                    Aucune activité enregistrée aujourd'hui.
                </p>

            </div>

        </section>


        <!-- Ajouter une activité -->
        <section class="mb-5">

            <h2 class="h5 fw-bold mb-4">
                Ajouter une activité
            </h2>


            <!-- Type d'activité -->
            <div class="mb-3">

                <label
                    for="type-activite"
                    class="form-label small">

                    Activité

                </label>

                <select
                    id="type-activite"
                    class="form-select">

                    <option value="marche">
                        Marche
                    </option>

                    <option value="course">
                        Course
                    </option>

                    <option value="velo">
                        Vélo
                    </option>

                    <option value="musculation">
                        Musculation
                    </option>

                    <option value="natation">
                        Natation
                    </option>

                    <option value="autre">
                        Autre
                    </option>

                </select>

            </div>


            <!-- Durée -->
            <div class="mb-3">

                <label
                    for="duree-activite"
                    class="form-label small">

                    Durée (minutes)

                </label>

                <input
                    type="number"
                    id="duree-activite"
                    class="form-control"
                    placeholder="Ex : 30">

            </div>


            <!-- Calories -->
            <div class="mb-4">

                <label
                    for="calories-activite"
                    class="form-label small">

                    Calories brûlées

                </label>

                <input
                    type="number"
                    id="calories-activite"
                    class="form-control"
                    placeholder="Ex : 250">

            </div>


            <!-- Bouton -->
            <button
                id="ajouter-activite"
                class="btn btn-primary w-100 py-2">

                Ajouter l'activité

            </button>

        </section>


        <!-- Historique -->
        <section>

            <h2 class="h5 fw-bold mb-3">
                Historique
            </h2>

            <p class="small mb-0">
                Les activités enregistrées apparaîtront ici.
            </p>

        </section>

    </main>


    <!-- Navigation basse -->
    <nav class="navbar fixed-bottom">

        <div class="container-fluid justify-content-around py-2">


            <!-- Accueil -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='index.html'">

                <span>⌂</span>

                <small>
                    Accueil
                </small>

            </button>


            <!-- Alimentation -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='alimentation.html'">

                <span>🍽</span>

                <small>
                    Repas
                </small>

            </button>


            <!-- Activité -->
            <button
                class="btn active d-flex flex-column align-items-center"
                onclick="window.location.href='activite.html'">

                <span>🏃</span>

                <small>
                    Activité
                </small>

            </button>


            <!-- Poids -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='poids.html'">

                <span>⚖</span>

                <small>
                    Poids
                </small>

            </button>


            <!-- Paramètres -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='parametres.html'">

                <span>⚙</span>

                <small>
                    Réglages
                </small>

            </button>

        </div>

    </nav>


    <!-- Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript personnalisé -->
    <script src="js/app.js"></script>

</body>

</html>
