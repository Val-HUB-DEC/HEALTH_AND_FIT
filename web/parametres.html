<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health & FIT - Réglages</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- En-tête -->
    <header class="px-4 pt-4 pb-3">

        <h1 class="fw-bold mb-0">
            Réglages
        </h1>

    </header>


    <!-- Contenu principal -->
    <main class="container-fluid px-4 pb-5">


        <!-- Profil -->
        <section class="mb-5">

            <h2 class="h5 fw-bold mb-4">
                Mon profil
            </h2>


            <!-- Prénom -->
            <div class="mb-3">

                <label
                    for="prenom"
                    class="form-label small">

                    Prénom

                </label>

                <input
                    type="text"
                    id="prenom"
                    class="form-control"
                    placeholder="Ex : Valentin">

            </div>


            <!-- Âge -->
            <div class="mb-3">

                <label
                    for="age"
                    class="form-label small">

                    Âge

                </label>

                <input
                    type="number"
                    id="age"
                    class="form-control"
                    placeholder="Ex : 24">

            </div>


            <!-- Taille -->
            <div class="mb-3">

                <label
                    for="taille"
                    class="form-label small">

                    Taille (cm)

                </label>

                <input
                    type="number"
                    id="taille"
                    class="form-control"
                    placeholder="Ex : 180">

            </div>


            <!-- Sexe -->
            <div class="mb-4">

                <label
                    for="sexe"
                    class="form-label small">

                    Sexe

                </label>

                <select
                    id="sexe"
                    class="form-select">

                    <option value="">
                        Sélectionner
                    </option>

                    <option value="homme">
                        Homme
                    </option>

                    <option value="femme">
                        Femme
                    </option>

                </select>

            </div>

        </section>


        <!-- Objectif -->
        <section class="mb-5">

            <h2 class="h5 fw-bold mb-4">
                Mon objectif
            </h2>


            <!-- Objectif -->
            <div class="mb-3">

                <label
                    for="objectif"
                    class="form-label small">

                    Objectif

                </label>

                <select
                    id="objectif"
                    class="form-select">

                    <option value="perte">
                        Perdre du poids
                    </option>

                    <option value="maintien">
                        Maintenir mon poids
                    </option>

                    <option value="prise">
                        Prendre du poids
                    </option>

                </select>

            </div>


            <!-- Poids cible -->
            <div class="mb-3">

                <label
                    for="poids-cible"
                    class="form-label small">

                    Poids cible (kg)

                </label>

                <input
                    type="number"
                    id="poids-cible"
                    class="form-control"
                    placeholder="Ex : 85"
                    step="0.1">

            </div>


            <!-- Calories -->
            <div class="mb-4">

                <label
                    for="objectif-calories"
                    class="form-label small">

                    Objectif calorique quotidien

                </label>

                <div class="input-group">

                    <input
                        type="number"
                        id="objectif-calories"
                        class="form-control"
                        placeholder="Ex : 2000">

                    <span class="input-group-text">
                        kcal
                    </span>

                </div>

            </div>


            <!-- Enregistrer -->
            <button
                id="enregistrer-parametres"
                class="btn btn-primary w-100 py-2">

                Enregistrer mes paramètres

            </button>

        </section>


        <!-- Préférences -->
        <section class="mb-5">

            <h2 class="h5 fw-bold mb-4">
                Préférences
            </h2>


            <!-- Notifications -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <div class="fw-semibold">
                        Notifications
                    </div>

                    <small>
                        Rappels et suivi quotidien
                    </small>

                </div>

                <div class="form-check form-switch">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="notifications">

                </div>

            </div>


            <!-- Confirmation -->
            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <div class="fw-semibold">
                        Confirmation avant suppression
                    </div>

                    <small>
                        Demander confirmation avant de supprimer une donnée
                    </small>

                </div>

                <div class="form-check form-switch">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="confirmation-suppression"
                        checked>

                </div>

            </div>

        </section>


        <!-- Données -->
        <section class="mb-5">

            <h2 class="h5 fw-bold mb-4">
                Données
            </h2>


            <!-- Réinitialisation -->
            <button
                id="reinitialiser-donnees"
                class="btn btn-outline-primary w-100 py-2">

                Réinitialiser mes données

            </button>

        </section>


        <!-- Informations -->
        <section>

            <h2 class="h5 fw-bold mb-3">
                À propos
            </h2>

            <div class="d-flex justify-content-between">

                <span>
                    Version
                </span>

                <span class="small">
                    1.0.1
                </span>

            </div>

        </section>

    </main>


    <!-- Navigation basse -->
    <nav class="navbar fixed-bottom">

        <div class="container-fluid justify-content-around py-2">


            <!-- Accueil -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='index.html'">

                <span>⌂</span>

                <small>
                    Accueil
                </small>

            </button>


            <!-- Alimentation -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='alimentation.html'">

                <span>🍽</span>

                <small>
                    Repas
                </small>

            </button>


            <!-- Activité -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='activite.html'">

                <span>🏃</span>

                <small>
                    Activité
                </small>

            </button>


            <!-- Poids -->
            <button
                class="btn d-flex flex-column align-items-center"
                onclick="window.location.href='poids.html'">

                <span>⚖</span>

                <small>
                    Poids
                </small>

            </button>


            <!-- Paramètres -->
            <button
                class="btn active d-flex flex-column align-items-center"
                onclick="window.location.href='parametres.html'">

                <span>⚙</span>

                <small>
                    Réglages
                </small>

            </button>

        </div>

    </nav>


    <!-- Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript personnalisé -->
    <script src="js/app.js"></script>

</body>

</html>
