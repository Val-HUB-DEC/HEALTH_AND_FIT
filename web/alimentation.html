<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health & FIT</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Alimentation</h1>
    </header>


    <main>

        <section>
            <h2>Aujourd'hui</h2>

            <div>
                <h3>Petit-déjeuner</h3>
                <div id="liste-petitDejeuner">
                    <p>Aucun aliment enregistré</p>
                </div>
            </div>

            <div>
                <h3>Déjeuner</h3>
                <div id="liste-dejeuner">
                    <p>Aucun aliment enregistré</p>
                </div>
            </div>

            <div>
                <h3>Dîner</h3>
                <div id="liste-diner">
                    <p>Aucun aliment enregistré</p>
                </div>
            </div>

            <div>
                <h3>Collation</h3>
                <div id="liste-collation">
                    <p>Aucun aliment enregistré</p>
                </div>
            </div>

            <div>
                <h3>Total de la journée</h3>
                <p>
                    <span id="total-calories">0</span> kcal
                </p>
            </div>
        </section>
        <section>

            <h2>Ajouter un aliment</h2>
            <label for="repas">Repas</label>

            <select id="repas">

                <option value="petitDejeuner">
                    Petit-déjeuner
                </option>

                <option value="dejeuner" selected>
                    Déjeuner
                </option>

                <option value="diner">
                    Dîner
                </option>

                <option value="collation">
                    Collation
                </option>

            </select>
            <label for="aliment">Aliment</label>
            <input type="text" id="aliment" placeholder="Ex : Poulet">

            <label for="quantite">Quantité (g)</label>
            <input type="number" id="quantite" placeholder="Ex : 150">

            <label for="calories">Calories pour 100 g</label>
            <input type="number" id="calories" placeholder="Ex : 165">

            <button id="ajouter-aliment">
                Ajouter
            </button>

        </section>

        <section>
            <h2>Bilan</h2>

            <div>
                <h3>Calories consommées</h3>
                <p>0 kcal</p>
            </div>

            <div>
                <h3>Objectif</h3>
                <p>0 kcal</p>
            </div>
        </section>

    </main>


    <nav>

        <button onclick="window.location.href='index.html'">
            Accueil
        </button>

        <button onclick="window.location.href='alimentation.html'">
            Alimentation
        </button>

        <button onclick="window.location.href='activite.html'">
            Activité
        </button>

        <button onclick="window.location.href='poids.html'">
            Poids
        </button>

        <button onclick="window.location.href='parametres.html'">
            Paramètres
        </button>

    </nav>


    <!-- Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript personnalisé -->
    <script src="js/app.js"></script>


</body>

</html>
